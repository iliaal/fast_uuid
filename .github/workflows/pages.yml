name: Deploy docs to GitHub Pages

# Publishes docs/ (the static API reference at docs/index.html) to GitHub
# Pages via the Actions deploy pipeline instead of the legacy Jekyll
# builder. The legacy builder is deprecated and failed transiently on
# this repo; this workflow uploads docs/ as a static artifact and deploys
# it deterministically, with build logs, on every push that touches it.
#
# Requires the repository Pages source to be set to "GitHub Actions"
# (build_type=workflow). .nojekyll in docs/ keeps the upload verbatim.

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {}

# Allow one concurrent deployment; don't cancel an in-progress one so a
# running publish always finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # Publishes the Pages deployment.
      id-token: write # Authenticates the deployment to Pages.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
