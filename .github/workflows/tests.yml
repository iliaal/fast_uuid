name: tests

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-runner:
    name: Benchmark runner regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shell syntax and error propagation
        run: |
          bash -n bench/run_neon.sh
          python3 .github/tests/test_benchmark_runner.py

  arginfo-sync:
    name: Generated arginfo matches stub
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-php main until a release marks PHP 8.6 stable; return to a tagged release then.
      - name: Setup PHP
        uses: shivammathur/setup-php@e8d43d139fbfbe401c32ef3a3a32e14075f20122 # main # zizmor: ignore[stale-action-refs,ref-version-mismatch]
        with:
          php-version: '8.5'
          tools: none
          extensions: none
      - name: Regenerate arginfo
        run: |
          curl -fsSLo /tmp/gen_stub.php \
            https://raw.githubusercontent.com/php/php-src/26fb2a8a117dee1011b7ea075f3fd269871372c8/build/gen_stub.php
          php /tmp/gen_stub.php fast_uuid.stub.php
          git diff --exit-code -- fast_uuid_arginfo.h

  build-test:
    name: "PHP ${{ matrix.php }} (NTS)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5', '8.6']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@e8d43d139fbfbe401c32ef3a3a32e14075f20122 # main # zizmor: ignore[stale-action-refs,ref-version-mismatch]
        with:
          php-version: ${{ matrix.php }}
          tools: none
          extensions: none
        env:
          phpts: nts
      - name: Build
        run: |
          phpize
          ./configure --enable-fast-uuid
          make -j"$(nproc)"
      - name: Guard against __cpu_model linkage
        run: |
          # SSSE3 detection uses a direct CPUID probe, not __builtin_cpu_supports;
          # __cpu_model reappearing means the libgcc dependency crept back in and
          # can break -shared under alternative toolchains (zig cc / compiler-rt).
          if nm modules/fast_uuid.so | grep -qi '__cpu_model\|__cpu_indicator_init'; then
            echo "unexpected __cpu_model / __cpu_indicator_init linkage"; exit 1
          fi
      - name: Test
        run: |
          make test TESTS="tests" \
            TEST_PHP_ARGS="-q" \
            NO_INTERACTION=1 REPORT_EXIT_STATUS=1
      - name: Dump diffs on failure
        if: failure()
        run: |
          for f in tests/*.diff tests/*.out tests/*.log; do
            [ -e "$f" ] || continue
            echo "===== $f ====="; cat "$f"
          done

  zts-canary:
    name: "PHP 8.4 (ZTS canary)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP (ZTS)
        uses: shivammathur/setup-php@e8d43d139fbfbe401c32ef3a3a32e14075f20122 # main # zizmor: ignore[stale-action-refs,ref-version-mismatch]
        with:
          php-version: '8.4'
          tools: none
          extensions: none
        env:
          phpts: zts
      - name: Build and test
        run: |
          phpize
          ./configure --enable-fast-uuid
          make -j"$(nproc)"
          make test TESTS="tests" TEST_PHP_ARGS="-q" NO_INTERACTION=1 REPORT_EXIT_STATUS=1

  scalar-canary:
    name: "PHP 8.4 (forced scalar formatter)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@e8d43d139fbfbe401c32ef3a3a32e14075f20122 # main # zizmor: ignore[stale-action-refs,ref-version-mismatch]
        with:
          php-version: '8.4'
          tools: none
          extensions: none
        env:
          phpts: nts
      - name: Build and test
        env:
          CFLAGS: -DFU_DISABLE_SSSE3
        run: |
          phpize
          ./configure --enable-fast-uuid
          make -j"$(nproc)"
          php -d extension="$PWD/modules/fast_uuid.so" --ri fast_uuid \
            | grep -F 'scalar'
          make test TESTS="tests" TEST_PHP_ARGS="-q" NO_INTERACTION=1 REPORT_EXIT_STATUS=1

  arm64-canary:
    name: "PHP 8.4 (ARM64 NEON canary)"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@e8d43d139fbfbe401c32ef3a3a32e14075f20122 # main # zizmor: ignore[stale-action-refs,ref-version-mismatch]
        with:
          php-version: '8.4'
          tools: none
          extensions: none
        env:
          phpts: nts
      - name: Build and test
        run: |
          phpize
          ./configure --enable-fast-uuid
          make -j"$(nproc)"
          php -d extension="$PWD/modules/fast_uuid.so" --ri fast_uuid \
            | grep -F 'AArch64 NEON'
          make test TESTS="tests" TEST_PHP_ARGS="-q" NO_INTERACTION=1 REPORT_EXIT_STATUS=1

  macos-canary:
    # release-linux.yml builds prebuilt binaries on macos-15; without this job
    # the clang/BSD-libc lane is first compiled by the release event itself,
    # after the tag is already public.
    name: "PHP ${{ matrix.php }} (macOS arm64 canary)"
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5', '8.6']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build PHP from pinned source
        uses: ./.github/actions/setup-php-macos
        with:
          php-version: ${{ matrix.php }}
      - name: Select built PHP
        run: echo "$RUNNER_TEMP/fastuuid-php/bin" >> "$GITHUB_PATH"
      - name: Build and test
        run: |
          phpize
          ./configure --enable-fast-uuid
          make -j"$(getconf _NPROCESSORS_ONLN)"
          php -d extension="$PWD/modules/fast_uuid.so" --ri fast_uuid \
            | grep -F 'AArch64 NEON'
          make test TESTS="tests" TEST_PHP_ARGS="-q" NO_INTERACTION=1 REPORT_EXIT_STATUS=1
      - name: Dump diffs on failure
        if: failure()
        run: |
          for f in tests/*.diff tests/*.out tests/*.log; do
            [ -e "$f" ] || continue
            echo "===== $f ====="; cat "$f"
          done

  windows-matrix:
    name: Resolve Windows test matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        uses: php/php-windows-builder/extension-matrix@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        with:
          php-version-list: '8.1, 8.2, 8.3, 8.4, 8.5, 8.6'

  windows-canary:
    name: "PHP ${{ matrix.php-version }} ${{ matrix.ts }} ${{ matrix.arch }} (Windows)"
    needs: windows-matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.windows-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: php/php-windows-builder/extension@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        with:
          php-version: ${{ matrix.php-version }}
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          run-tests: 'true'

  composer-validate:
    name: "composer validate --strict"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@e8d43d139fbfbe401c32ef3a3a32e14075f20122 # main # zizmor: ignore[stale-action-refs,ref-version-mismatch]
        with:
          php-version: '8.4'
          tools: composer
      - name: Validate root manifest
        run: composer validate --strict --no-check-publish
      - name: Validate compat manifest
        run: composer validate --strict --no-check-publish --working-dir=compat

  pie-smoke:
    name: "PIE path-repository build (PHP 8.4)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@e8d43d139fbfbe401c32ef3a3a32e14075f20122 # main # zizmor: ignore[stale-action-refs,ref-version-mismatch]
        with:
          php-version: '8.4'
          tools: phpize, php-config
          coverage: none
      - name: Download PIE
        env:
          PIE_VERSION: '1.4.10'
          PIE_SHA256: b88792235c8e80be568436d4cb043b49fd1869c89b64e83d23e2882ae19d70a8
        run: |
          curl -fsSL -o /tmp/pie.phar "https://github.com/php/pie/releases/download/${PIE_VERSION}/pie.phar"
          echo "${PIE_SHA256}  /tmp/pie.phar" | sha256sum -c -
          chmod +x /tmp/pie.phar
      - name: PIE build smoke
        run: |
          php /tmp/pie.phar repository:add path .
          php /tmp/pie.phar build iliaal/fast_uuid:*@dev --enable-fast-uuid
