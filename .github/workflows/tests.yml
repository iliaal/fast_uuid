name: tests

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: "PHP ${{ matrix.php }} (NTS)"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          extensions: none
        env:
          phpts: nts
      - name: Build
        run: |
          phpize
          ./configure --enable-fast-uuid
          make -j"$(nproc)"
      - name: Test
        run: |
          make test TESTS="tests" \
            TEST_PHP_ARGS="-q" \
            NO_INTERACTION=1 REPORT_EXIT_STATUS=1
      - name: Dump diffs on failure
        if: failure()
        run: |
          for f in tests/*.diff tests/*.out tests/*.log; do
            [ -e "$f" ] || continue
            echo "===== $f ====="; cat "$f"
          done

  zts-canary:
    name: "PHP 8.4 (ZTS canary)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP (ZTS)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none
          extensions: none
        env:
          phpts: zts
      - name: Build and test
        run: |
          phpize
          ./configure --enable-fast-uuid
          make -j"$(nproc)"
          make test TESTS="tests" TEST_PHP_ARGS="-q" NO_INTERACTION=1 REPORT_EXIT_STATUS=1

  composer-validate:
    name: "composer validate --strict"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
      - name: Validate root manifest
        run: composer validate --strict --no-check-publish
      - name: Validate compat manifest
        run: composer validate --strict --no-check-publish --working-dir=compat

  pie-smoke:
    name: "PIE path-repository install (PHP 8.4)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: fast_uuid
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer, pie
      - name: Install via PIE from a path repository
        run: |
          pie repository:add path "$GITHUB_WORKSPACE/fast_uuid"
          pie install iliaal/fast_uuid
          php -m | grep -qi fast_uuid
          php -d extension=fast_uuid -r 'echo \FastUuid\Uuid::uuid4(), PHP_EOL;'
