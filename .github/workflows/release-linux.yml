name: Release Linux & macOS binaries

# Intel macOS runners had 30+ minute queues; Alpine needs additional setup.
# Both use PIE's composer-default source-build fallback until lanes are added.

on:
  release:
    types: [published]
  # Validate release builds before creating the tag.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-linux-${{ github.event.release.tag_name || github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.os }} php ${{ matrix.php }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # Uploads binary assets to the published release.
    strategy:
      fail-fast: false
      matrix:
        # Pin the toolchain/glibc baseline of published binaries.
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-14
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Build and upload prebuilt binary
        if: github.event_name == 'release'
        uses: php/pie-ext-binary-builder@cbe134360897f23793f23c2edc7602261d205a25 # 0.0.4
        with:
          release-tag: ${{ github.event.release.tag_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          configure-flags: '--enable-fast-uuid'

      - name: Build and test only (pre-tag dry run)
        if: github.event_name != 'release'
        run: |
          phpize
          ./configure --enable-fast-uuid
          make -j"$(getconf _NPROCESSORS_ONLN)"
          make test TESTS="tests" TEST_PHP_ARGS="-q" NO_INTERACTION=1 REPORT_EXIT_STATUS=1
