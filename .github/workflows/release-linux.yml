name: Release Linux & macOS binaries

# Triggered when a GitHub Release is published. Builds .so binaries for
# Linux glibc (x86_64 + arm64) and macOS (arm64) at the PHP versions in
# the matrix (NTS only -- ZTS lives in the Windows lane), uploads each
# as a release asset via php/pie-ext-binary-builder using PIE's
# pre-packaged-binary naming convention.
#
# macOS Intel (macos-13) is intentionally absent -- GitHub's Intel
# runner pool is too contended to ship reliably (jobs queue 30+ min on
# busy days, blocking release closeout), and macOS 26 drops Intel
# support anyway. Intel-Mac users source-build via PIE's
# composer-default fallback.
#
# Linux musl (Alpine) is intentionally absent -- shivammathur/setup-php
# in Alpine containers needs more setup, and Alpine users get install via
# PIE's composer-default source-build fallback in the meantime. Add a
# musl lane only if user demand surfaces.
#
# composer.json declares:
#   "download-url-method": ["pre-packaged-binary", "composer-default"]
# so PIE prefers the prebuilt asset and falls back to source-build when
# no asset matches.

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-linux-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.os }} php ${{ matrix.php }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # Uploads binary assets to the published release.
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 (x86_64), ubuntu-24.04-arm (arm64),
        # macos-14 (Apple Silicon arm64). Pinned over `*-latest` to
        # avoid silent runner shifts that would change the toolchain /
        # glibc baseline on published release assets without a repo
        # diff.
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-14
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Build and upload prebuilt binary
        uses: php/pie-ext-binary-builder@5298761950f63c7e9565ed7004e922b346e4386c # 0.0.3
        with:
          release-tag: ${{ github.event.release.tag_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          configure-flags: '--enable-fast-uuid'
