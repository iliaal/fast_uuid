name: Release Linux & macOS binaries

# Intel macOS runners had 30+ minute queues; Alpine needs additional setup.
# Both use PIE's composer-default source-build fallback until lanes are added.

on:
  release:
    types: [published]
  # Validate release builds before creating the tag.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-linux-${{ github.event.release.tag_name || github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.os }} php ${{ matrix.php }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # Uploads binary assets to the published release.
    strategy:
      fail-fast: false
      matrix:
        # Pin the toolchain/glibc baseline of published binaries.
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
        php: ['8.4', '8.5', '8.6']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-php main until a release marks PHP 8.6 stable; return to a tagged release then.
      - name: Setup PHP
        if: runner.os != 'macOS'
        uses: shivammathur/setup-php@3c21e10268bafaf84c59e8f4e65b39acacb62ca4 # main # zizmor: ignore[stale-action-refs,ref-version-mismatch]
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Build PHP from pinned source
        if: runner.os == 'macOS'
        uses: ./.github/actions/setup-php-macos
        with:
          php-version: ${{ matrix.php }}

      - name: Select built PHP
        if: runner.os == 'macOS'
        run: echo "$RUNNER_TEMP/fastuuid-php/bin" >> "$GITHUB_PATH"

      - name: Build and upload prebuilt binary
        if: github.event_name == 'release'
        uses: php/pie-ext-binary-builder@cbe134360897f23793f23c2edc7602261d205a25 # 0.0.4
        with:
          release-tag: ${{ github.event.release.tag_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          configure-flags: '--enable-fast-uuid'

      - name: Build and test only (pre-tag dry run)
        if: github.event_name != 'release'
        run: |
          phpize
          ./configure --enable-fast-uuid
          make -j"$(getconf _NPROCESSORS_ONLN)"
          make test TESTS="tests" TEST_PHP_ARGS="-q" NO_INTERACTION=1 REPORT_EXIT_STATUS=1

      # Package the dry-run module like the release archives so a pre-tag
      # PHP symbol-floor check can inspect the exact binary this run built.
      - name: Package module (pre-tag dry run)
        if: github.event_name != 'release'
        env:
          PHP_MINOR: ${{ matrix.php }}
        run: |
          set -euo pipefail
          arch=$(uname -m)
          [ "$arch" = aarch64 ] && arch=arm64
          case "$(uname -s)" in
            Linux) platform=linux-glibc ;;
            Darwin) platform=darwin-bsdlibc ;;
            *) echo "unsupported OS $(uname -s)" >&2; exit 1 ;;
          esac
          name="php_fast_uuid-dryrun_php${PHP_MINOR}-${arch}-${platform}"
          mkdir -p dist
          zip -j "dist/${name}.zip" modules/fast_uuid.so
          echo "ARCHIVE_NAME=${name}" >> "$GITHUB_ENV"

      - name: Upload module artifact (pre-tag dry run)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: dist/${{ env.ARCHIVE_NAME }}.zip
          if-no-files-found: error
          retention-days: 7
