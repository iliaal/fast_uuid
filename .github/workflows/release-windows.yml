name: Release Windows binaries

# Triggered when a GitHub Release is published (manual or from a tag push
# via /release-ext). Builds the extension on every supported PHP version
# x architecture x thread-safety variant on Windows runners, then
# uploads each .dll as a release asset following the PIE-compatible
# naming convention (php_fast_uuid-<version>-<php_x.y>-<ts|nts>-vs17-<arch>.zip).
#
# The PHPT suite runs here (run-tests: 'true') so Windows artifacts are
# never shipped without Windows test coverage -- the tests.yml matrix is
# Linux-only, so this lane is the only place the suite exercises MSVC builds.

on:
  release:
    types: [published]
  # Manual trigger to validate the MSVC build against a branch without
  # publishing a release. The upload job is gated to the release event, so a
  # dispatch run only exercises the build matrix.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-windows-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    name: Resolve Windows release matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: matrix
        uses: php/php-windows-builder/extension-matrix@e03e5d39879adaeb61ed2225f0f4eae7db8c1df8 # 1.8.1
        with:
          # 8.6 is supported/tested (tests.yml) but omitted here until its GA:
          # php-windows-builder has no pre-release 8.6 Windows builds to link against.
          php-version-list: '8.1, 8.2, 8.3, 8.4, 8.5'

  build:
    name: Build ${{ matrix.php-version }} ${{ matrix.ts }} ${{ matrix.arch }}
    needs: matrix
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: php/php-windows-builder/extension@e03e5d39879adaeb61ed2225f0f4eae7db8c1df8 # 1.8.1
        with:
          php-version: ${{ matrix.php-version }}
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          run-tests: 'true'

  release:
    name: Upload binaries to the release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'
    # GITHUB_TOKEN defaults to read-only for `contents:` on newer repos.
    # The release/asset-upload API needs write access; without this block
    # `gh release upload` returns HTTP 403 "Resource not accessible by
    # integration". See ~/ai/wiki/architecture/php-extensions.md, the
    # "Windows binary releases" section, for the full backstory.
    permissions:
      contents: write # Uploads Windows binaries to the published release.
    steps:
      - uses: php/php-windows-builder/release@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        with:
          release: ${{ github.event.release.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
