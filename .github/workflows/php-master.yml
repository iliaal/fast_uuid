name: PHP master (advisory)

# Builds against php-src master through setup-php's nightly build. The job is
# continue-on-error, so an upstream break shows up here without blocking merges.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: php-master-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  php-master:
    name: PHP 8.7 (master, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@2001cd3148dcbaf467b7fa06cd7155ebb6d4cacf # main # zizmor: ignore[stale-action-refs,ref-version-mismatch]
        with:
          php-version: '8.7'
          tools: none
          extensions: none
        env:
          phpts: nts
      - name: Show PHP build
        run: php -v
      - name: Build
        run: |
          phpize
          ./configure --enable-fast-uuid
          make -j"$(nproc)"
      - name: Guard against __cpu_model linkage
        run: |
          # SSSE3 detection uses a direct CPUID probe, not __builtin_cpu_supports;
          # __cpu_model reappearing means the libgcc dependency crept back in and
          # can break -shared under alternative toolchains (zig cc / compiler-rt).
          if nm modules/fast_uuid.so | grep -qi '__cpu_model\|__cpu_indicator_init'; then
            echo "unexpected __cpu_model / __cpu_indicator_init linkage"; exit 1
          fi
      - name: Test
        run: |
          make test TESTS="tests" \
            TEST_PHP_ARGS="-q" \
            NO_INTERACTION=1 REPORT_EXIT_STATUS=1
      - name: Dump diffs on failure
        if: failure()
        run: |
          for f in tests/*.diff tests/*.out tests/*.log; do
            [ -e "$f" ] || continue
            echo "===== $f ====="; cat "$f"
          done

  report:
    name: Report master result
    needs: php-master
    # Runs for the weekly schedule and manual runs only; the job above never
    # fails the workflow, so this is what surfaces a break without a PR.
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # read this run's job conclusions
      issues: write # open, comment on, and close the tracking issue
    steps:
      - name: Open, update, or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_NAME: PHP 8.7 (master, advisory)
          TITLE: PHP master (8.7-dev) build is failing
        run: |
          set -euo pipefail
          conclusion=$(gh run view "$RUN_ID" --json jobs --jq '.jobs[] | select(.name == env.JOB_NAME) | .conclusion')
          issue=$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == env.TITLE) | .number' | head -n 1)
          echo "job conclusion: ${conclusion:-unknown}; open issue: ${issue:-none}"
          case "$conclusion" in
            failure|timed_out)
              if [ -n "$issue" ]; then
                gh issue comment "$issue" --body "Still failing against php-src master: $RUN_URL"
              else
                gh issue create --title "$TITLE" --body "The advisory job that builds and tests against php-src master (PHP 8.7-dev) failed: $RUN_URL

          This issue closes itself after a later scheduled or manual run passes."
              fi
              ;;
            success)
              if [ -n "$issue" ]; then
                gh issue comment "$issue" --body "Passing against php-src master again: $RUN_URL"
                gh issue close "$issue"
              fi
              ;;
          esac
